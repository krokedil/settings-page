# Integration suite configuration
#
# Run integration and "WordPress unit" tests.

actor: IntegrationTester
bootstrap: _bootstrap.php
modules:
    enabled:
        - lucatume\WPBrowser\Module\WPLoader
    config:
        lucatume\WPBrowser\Module\WPLoader:
            wpRootFolder: "%WORDPRESS_ROOT_DIR%"
            dbUrl: "%WORDPRESS_DB_URL%"
            wpDebug: true
            tablePrefix: "%TEST_TABLE_PREFIX%"
            domain: "%WORDPRESS_DOMAIN%"
            adminEmail: "admin@%WORDPRESS_DOMAIN%"
            title: "Integration Tests"
            plugins:
                - woocommerce/woocommerce.php
            theme: ""
            # Once WordPress + WooCommerce are installed in the SQLite test DB, skip
            # the install/activation cycle on subsequent runs and just load the
            # plugins. This avoids WooCommerce/ActionScheduler re-running its
            # `ALTER TABLE ... MODIFY COLUMN` upgrade step, which the SQLite drop-in
            # cannot translate. A fresh/empty DB is still installed from scratch.
            skipInstall: true
